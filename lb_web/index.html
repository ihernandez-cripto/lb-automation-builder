<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Conexiones - SmartVista Load Balancer</title>
    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h2>Configuración SVLB (Multi-Agent Orchestrator)</h2>

    <!-- SECCIÓN 1: RAG HISTORIA DE USUARIOS -->
    <div class="section-box">
        <h3 style="margin-top: 0; color: #28a745;">Generar Regla desde Historia de Usuario</h3>
        <div class="form-group">
            <label for="userStoryInput">Historia de Usuario / Requerimiento:</label>
            <div class="help-text">Ingrese el texto con el ambiente, nodo, IPs y rangos de puertos.</div>
            <textarea id="userStoryInput" placeholder="Ej: En el ambiente de QA se debe configurar la conexión en el load balancer con IP 172.29.12.67..."></textarea>
        </div>
        <button type="button" id="btnUserStory" onclick="ejecutarHistoriaUsuario(event); return false;" class="btn-primary">
            Procesar Historia de Usuario con Agente RAG
        </button>
    </div>

    <!-- SECCIÓN 2: CONFIGURACIÓN MANUAL -->
    <div class="section-box">
        <h3 style="margin-top: 0; color: #0056b3;">Validación Manual de Red / Protocolo</h3>
        <div class="form-group">
            <label for="ipAddress">Dirección IP (`raddr` / `ip`):</label>
            <input type="text" id="ipAddress" placeholder="Ej. 192.168.56.102">
        </div>

        <div class="form-group">
            <label for="portConfig">Puerto / Rango (`lport` / `ports`):</label>
            <input type="text" id="portConfig" placeholder="Ej. 10000">
        </div>

        <div class="form-group">
            <label for="portRangeCount">Cantidad en Rango (Opcional):</label>
            <input type="text" id="portRangeCount" placeholder="Ej. 10">
        </div>

        <div class="form-group">
            <label for="mhdrPreset">Modo de Enmarcado / Cabecera (`mhdr`):</label>
            <select id="mhdrPreset">
                <option value="CDb4">CDb4 (Caracteres, Decimal, Big-Endian, 4 Bytes)</option>
                <option value="BHb2">BHb2 (Binario, Hexadecimal, Big-Endian, 2 Bytes)</option>
                <option value="visa">visa (Redes Visa Base I / SMS)</option>
                <option value="amex">amex / iBHb2 (Redes American Express)</option>
                <option value="x0CDb4">x0CDb4 (Cabecera Extendida Genérica + CDb4)</option>
            </select>
        </div>

        <button type="button" id="btnManual" onclick="ejecutarConfigManual(event)" class="btn-primary">
            Procesar Configuración Manual
        </button>
    </div>

    <!-- PANEL DE RESULTADOS -->
    <h3>Resultado de la Configuración:</h3>
    <pre id="outputPanel" class="output-panel">// Esperando ejecución...</pre>

    <!-- BOTÓN DE DESCARGA -->
    <div id="downloadContainer" class="download-container">
        <button type="button" onclick="descargarJSON()" class="btn btn-success">
            📥 Descargar Archivo JSON
        </button>
    </div>
</div>

<!-- Lógica JS externa -->
<script src="script.js"></script>
</body>
</html>
