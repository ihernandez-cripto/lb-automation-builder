<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Conexiones - SmartVista Load Balancer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Configuración SVLB (Multi-Agent Integration)</h2>
    <form id="slbForm">
        
        <!-- DIRECCIONES IP -->
        <div class="form-group">
            <label for="ipAddress">Dirección IP (`raddr` / `ip`):</label>
            <div class="help-text">Ingrese una dirección IP (Ej. 192.168.56.102) o 0.0.0.0.</div>
            <input type="text" id="ipAddress" placeholder="Ej. 192.168.56.102" required 
                   pattern="^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$">
        </div>

        <!-- PUERTOS -->
        <div class="grid-2">
            <div class="form-group">
                <label for="portConfig">Puerto / Rango (`lport` / `ports`):</label>
                <div class="help-text">Ejemplos: 10000 o 20001-20005.</div>
                <input type="text" id="portConfig" placeholder="Ej. 10000" required>
            </div>
            
            <div class="form-group">
                <label for="portRangeCount">Cantidad en Rango (Opcional):</label>
                <div class="help-text">Si aplica conteo (Sintaxis '10/mhdr').</div>
                <input type="text" id="portRangeCount" placeholder="Ej. 10">
            </div>
        </div>

        <!-- LONGITUD Y FORMATO DE CABECERA (MHDR) -->
        <div class="form-group">
            <label for="mhdrPreset">Modo de Enmarcado / Cabecera (`mhdr`):</label>
            <div class="help-text">Seleccione un formato predefinido o personalizado.</div>
            <select id="mhdrPreset">
                <option value="CDb4">CDb4 (Caracteres, Decimal, Big-Endian, 4 Bytes)</option>
                <option value="BHb2">BHb2 (Binario, Hexadecimal, Big-Endian, 2 Bytes)</option>
                <option value="visa">visa (Redes Visa Base I / SMS)</option>
                <option value="amex">amex / iBHb2 (Redes American Express)</option>
                <option value="x0CDb4">x0CDb4 (Cabecera Extendida Genérica + CDb4)</option>
                <option value="custom">-- Personalizado --</option>
            </select>
        </div>

        <div id="customHeaderGroup" class="form-group" style="display: none;">
            <label for="customMhdr">Cabecera Genérica Personalizada:</label>
            <div class="help-text">Sintaxis: [xN][i][C|B][D|H][b|l][1-9] (Ej. iBHb4).</div>
            <input type="text" id="customMhdr" placeholder="Ej. x800BHb2">
        </div>

        <button type="submit">Procesar con Agentes Backend</button>
    </form>

    <!-- Panel para mostrar el resultado JSON -->
    <div id="outputPanel" class="output-panel" role="status" aria-live="polite"></div>
</div>

<script src="app.js" defer></script>

</body>
</html>
